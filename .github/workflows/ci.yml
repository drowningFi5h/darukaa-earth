name: Quality and deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://darukaa:darukaa@localhost:5433/darukaa
      JWT_SECRET: ci-only-secret-not-for-production-123456789
      DEMO_PASSWORD: ci-demo-password-12345
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run build
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend && uv run --project backend ruff format --check backend
      - run: uv run alembic upgrade head && uv run pytest -q
        working-directory: backend
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified commit
        id: release
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            response=$(curl --fail --silent --show-error --request POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}")
          else
            test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID"
            payload=$(jq -n --arg commit "$GITHUB_SHA" '{commitId: $commit}')
            response=$(curl --fail --silent --show-error --request POST \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data "$payload" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          fi
          deploy_id=$(echo "$response" | jq -r '.id // .deploy.id // empty')
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Requested deployment of ${GITHUB_SHA}: ${deploy_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployment becomes live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.release.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            status=$(curl --fail --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "Deploy status: $status"
            case "$status" in
              live) echo "Verified live deployment: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment did not become live within 15 minutes"
          exit 1
