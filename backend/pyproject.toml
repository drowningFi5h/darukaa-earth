[project]
name = "darukaa-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "geoalchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "shapely>=2.0,<3", "email-validator>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
